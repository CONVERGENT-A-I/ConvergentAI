# Section 0 — scenario set (S0-08a).
# STATUS: DRAFT, PENDING DAVID'S APPROVAL. Once approved this file is LOCKED: no one edits it or its
# pass criteria without David's written sign-off (CLAUDE.md hard rule).
#
# Source: "Post-Greeting Prospect Test Set" (#1–#30), Revised spec acceptance tests (A3–A13) and the
# transfer/scheduling cases T1–T6. Corrections from the Revised spec (plan Appendix A) are applied:
# construction → bridge response + loan officer; "expected next move" = the first missing item for the
# track (the track's own order decides after the first-name turn).
# Not here: A1 (greeting, cards, consent, mic — visual, checked in the browser), A2 (same line as #1 —
# merged into #1), A14 (track regression — tracks_regression.yaml).
#
# userdata.expected_facts is checked at the end of every run (src/section0/sim-checks.ts): what Ailana
# STORED must match what the borrower said, so a smooth conversation with wrong data still fails.
# Run with SECTION_0_ENABLED=true. All people and numbers are invented.
id: SCNG_section0
name: Section 0 (30 + A3–A13 + T1–T6) — DRAFT for approval
scenarios:

  # ─────────────────────────── David's 30 prospect replies ───────────────────────────

  - id: SCN_s0_t01
    label: "#1 — drove by a house, 84k, 1,200 debt, 710 (also A2)"
    instructions: |
      PERSONA: Jordan Ellis, a renter who wants to buy a home to live in (invented person).
      OPENING LINE: "I just drove by a house that I like that I would like to have as my residence and I would like to see if I am eligible for a mortgage. I make 84,000 per year and have 1200.00 per month in debt and my credit score is 710."
      FACTS (reveal each only when asked, one per turn; never volunteer extra):
      - first name: Jordan · never worked with this lender · hoping to buy within three months
      - applying alone · 30,000 saved · currently rent · no real estate agent yet
      - the house is listed at about 350,000, a single-family home in Chattanooga, TN 37421
      - no military service · salaried at the same employer for 6 years
      - you will NOT give a street address; if asked, give only the city and zip
      HOW TO ANSWER: one short, natural answer per turn. If Ailana asks for something you already said,
      answer again briefly with the same numbers — do not argue. If asked anything not listed, say you're not sure.
      STOP: after 8 of your replies, or as soon as Ailana offers a choice between a credit review and a summary,
      or the conversation is handed to a loan officer — whichever comes first.
    agent_expectations: >
      Treats the goal as a home purchase for a primary residence with no separate "is that right?"
      confirmation turn. Never asks again for the $84,000 income, the $1,200 monthly debts, the 710 score
      or whether the home is the caller's residence. The next questions are things not yet stated, such as
      the first name, the area or the savings. Never asks for or repeats a street address. Treats 710 as
      self-reported. Does not quote a rate or payment and does not promise approval. No transfer or
      appointment is attempted unless the prospect asks for one.
    tags: { feature: section0, test_set_id: "1" }
    userdata:
      expect_transfer: false
      expect_booking: false
      expected_facts:
        track: TT-PUR
        values: { occupancy: primary }
        numbers: { debt.monthly_total: 1200 }
        credit: 710
        income_total_annual: 84000

