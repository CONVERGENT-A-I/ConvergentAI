# Section 0 — STRESS SET (S0-30): varied phrasings. Reported SEPARATELY from the approved set.
# Not approved by David and never part of the exit bar. Purpose: show whether Section 0 generalises to
# wording no approved scenario uses (numbers in words, slang, typos, fillers, hedging, facts buried in a
# story, indirect goals, odd ways of asking for a person). A large gap between this set and section0.yaml
# would mean the fixes fit the approved wording rather than the meaning (overfitting).
#
# Rule (CLAUDE.md): failures here are fixed only GENERICALLY (schema / code), never with prompt rules for
# a specific phrasing. Real transcripts handled poorly go to scenarios_proposed.yaml for David.
# userdata.expected_facts is checked at the end of every run, as in the approved set.
# Run with SECTION_0_ENABLED=true. All people and numbers are invented.
id: SCNG_section0_stress
name: Section 0 stress set (varied phrasings) — reported separately
scenarios:

  - id: SCN_s0_st01_words
    label: "ST1 — numbers in words (purchase)"
    instructions: |
      PERSONA: Avery Lane, a renter who wants to buy a home to live in (invented person).
      OPENING LINE: "Hi there. So I'm hoping to buy a place to live in. I earn eighty-four thousand a year, my monthly debts come to about twelve hundred, and my credit score is seven ten."
      FACTS (reveal each only when asked, one per turn; never volunteer extra):
      - first name: Avery · never worked with this lender · hoping to buy within three months
      - applying alone · thirty thousand saved · currently rent · no real estate agent yet
      - looking around 350,000, a single-family home in Chattanooga, TN 37421
      - no military service · salaried at the same employer for 6 years
      HOW TO ANSWER: one short, natural answer per turn. If Ailana asks for something you already said,
      answer again briefly with the same numbers — do not argue. If asked anything not listed, say you're not sure.
      STOP: after 8 of your replies, or as soon as Ailana offers a choice between a credit review and a summary,
      or the conversation is handed to a loan officer — whichever comes first.
    agent_expectations: >
      Treats the goal as a home purchase for a primary residence without a separate confirmation turn.
      Never asks again for the income, the monthly debts or the credit score. Does not quote a rate or
      payment and does not promise approval.
    tags: { feature: section0_stress, test_set_id: "ST1" }
    userdata:
      expect_transfer: false
      expect_booking: false
      expected_facts:
        track: TT-PUR
        values: { occupancy: primary }
        numbers: { debt.monthly_total: 1200 }
        credit: 710
        income_total_annual: 84000

