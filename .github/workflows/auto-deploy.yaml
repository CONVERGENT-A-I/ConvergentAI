name: Deploy CONVERGENT-AI to GCP VM

on:
  # dev: auto-deploy on every push
  push:
    branches:
      - dev
  # main (production): manual only
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to deploy"
        required: true
        default: production
        type: choice
        options:
          - production
          - dev

# Prevent overlapping deploys to the same environment
concurrency:
  group: deploy-${{ github.ref_name }}-${{ github.event.inputs.target || 'auto' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ---- Resolve environment -> branch + app dir (single source of truth) ----
      # Rules:
      #  - push to dev            -> dev (auto)
      #  - manual dispatch input  -> production or dev (as chosen)
      - name: Resolve target
        id: env
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target }}"
          else
            TARGET="dev"   # push trigger only fires on dev branch
          fi

          # git_dir  = where the repo lives (git pull happens here)
          # compose_dir = where `docker compose` runs (holds compose file/.env)
          if [ "$TARGET" = "production" ]; then
            echo "branch=main"                                            >> "$GITHUB_OUTPUT"
            echo "git_dir=/opt/convergent-ai/ConvergentAI"                >> "$GITHUB_OUTPUT"
            echo "compose_dir=/opt/convergent-ai/ConvergentAI"            >> "$GITHUB_OUTPUT"
            echo "env_name=production"                                    >> "$GITHUB_OUTPUT"
          else
            echo "branch=dev"                                                     >> "$GITHUB_OUTPUT"
            echo "git_dir=/opt/convergent-ai/convergent-dev/ConvergentAI"         >> "$GITHUB_OUTPUT"
            echo "compose_dir=/opt/convergent-ai/convergent-dev/docker"           >> "$GITHUB_OUTPUT"
            echo "env_name=dev"                                                   >> "$GITHUB_OUTPUT"
          fi

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Docker app to GCP VM (${{ steps.env.outputs.env_name }})
        env:
          BRANCH: ${{ steps.env.outputs.branch }}
          GIT_DIR: ${{ steps.env.outputs.git_dir }}
          COMPOSE_DIR: ${{ steps.env.outputs.compose_dir }}
        run: |
          gcloud compute ssh convergent-ai \
            --zone us-east1-b \
            --project ailana-488814 \
            --tunnel-through-iap \
            --quiet \
            --command="sudo BRANCH='${BRANCH}' GIT_DIR='${GIT_DIR}' COMPOSE_DIR='${COMPOSE_DIR}' bash -s" <<'EOF'
          set -euo pipefail
          echo "==> Target branch : ${BRANCH}"
          echo "==> Git directory : ${GIT_DIR}"
          echo "==> Compose dir   : ${COMPOSE_DIR}"

          # 1) Update source code
          echo "==> Pull latest code (${BRANCH})"
          # Mark repo safe FIRST (running under sudo -> /root HOME; git 2.35+ blocks
          # 'dubious ownership' otherwise, which surfaces as 'not a git repository').
          git config --global --add safe.directory "${GIT_DIR}" || true
          git -C "${GIT_DIR}" rev-parse --is-inside-work-tree >/dev/null 2>&1 || {
            echo "ERROR: ${GIT_DIR} is not a git repo (under sudo). Ownership/safe.directory?" >&2
            ls -la "${GIT_DIR}/.git" >&2 || true
            exit 1
          }
          git -C "${GIT_DIR}" fetch origin "${BRANCH}"
          git -C "${GIT_DIR}" checkout "${BRANCH}"
          git -C "${GIT_DIR}" reset --hard "origin/${BRANCH}"

          # 2) Locate compose file in the compose dir
          cd "${COMPOSE_DIR}"
          if   [ -f docker-compose.yaml ]; then COMPOSE="-f docker-compose.yaml"
          elif [ -f docker-compose.yml  ]; then COMPOSE="-f docker-compose.yml"
          elif [ -f docker/docker-compose.yaml ]; then COMPOSE="-f docker/docker-compose.yaml"
          else
            echo "No docker-compose file found under ${COMPOSE_DIR}" >&2
            ls -la "${COMPOSE_DIR}" >&2
            exit 1
          fi
          echo "==> Compose dir: $(pwd)  file: ${COMPOSE}"

          # docker compose (v2) with docker-compose (v1) fallback
          dc() { docker compose $COMPOSE "$@" || docker-compose $COMPOSE "$@"; }

          echo "==> Docker usage BEFORE deploy"
          docker system df || true

          echo "==> Stop old containers"
          dc down || true

          echo "==> Rebuild and recreate containers"
          dc up -d --build

          echo "==> Verify containers"
          docker ps | grep convergent || true

          echo "==> Cleanup"
          docker builder prune -a -f || true
          docker image prune -f || true
          docker container prune -f || true
          EOF
