name: Deploy CONVERGENT-AI to GKE

# - push to "dev"         -> auto build + deploy into GKE cluster dev env.
# - push to "main"        -> Manual deploy.
# - Prod manual deploy    -> Tab Actions -> "Run workflow" -> choose the target "production".
on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to deploy"
        required: true
        default: production
        type: choice
        options:
          - production
          - dev

concurrency:
  group: deploy-${{ github.ref_name }}-${{ github.event.inputs.target || 'auto' }}
  cancel-in-progress: false

env:
  DEVOPS_REPO_OWNER: sonphm
  DEVOPS_REPO_NAME: convergentai-devops
  GCP_PROJECT: ailana-488814
  GCP_REGION: us-east1
  ARTIFACT_REPO: convergent-ai
  GKE_CLUSTER: gke-convergent-ai-prod-7d82
  GKE_LOCATION: us-east4

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve target
        id: env
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target }}"
          else
            TARGET="dev"
          fi

          if [ "$TARGET" = "production" ]; then
            echo "docker_env=prod"                                    >> "$GITHUB_OUTPUT"
            echo "values_file=values_prod.yaml"                       >> "$GITHUB_OUTPUT"
            echo "namespace=cta-prod"                                 >> "$GITHUB_OUTPUT"
            echo "helm_release=cta-prod"                     >> "$GITHUB_OUTPUT"
            echo "secret_prefix=prod-convergent"                      >> "$GITHUB_OUTPUT"
            echo "backend_url=https://be.convergentai.tech"           >> "$GITHUB_OUTPUT"
            echo "env_name=production"                                >> "$GITHUB_OUTPUT"
          else
            echo "docker_env=dev"                                     >> "$GITHUB_OUTPUT"
            echo "values_file=values_dev.yaml"                        >> "$GITHUB_OUTPUT"
            echo "namespace=cta-dev"                                  >> "$GITHUB_OUTPUT"
            echo "helm_release=cta-dev"                      >> "$GITHUB_OUTPUT"
            echo "secret_prefix=dev-convergent"                       >> "$GITHUB_OUTPUT"
            echo "backend_url=https://dev-be.convergentai.tech"       >> "$GITHUB_OUTPUT"
            echo "env_name=dev"                                       >> "$GITHUB_OUTPUT"
          fi
          echo "==> Deploying target: $TARGET"

      # 1. Checkout Source codes repo
      - name: Checkout app source (ConvergentAI)
        uses: actions/checkout@v4

      # 2. Checkout DevOps repo
      - name: Checkout devops repo (Dockerfile + Helm chart)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEVOPS_REPO_OWNER }}/${{ env.DEVOPS_REPO_NAME }}
          ref: main
          token: ${{ secrets.GIT_DEVOPS_TOKEN }}
          path: devops

      # 3. Google Cloud authen
      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker cho Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # 4. Build & push backend image 
      - name: Build & push backend image
        env:
          DOCKER_ENV: ${{ steps.env.outputs.docker_env }}
        run: |
          set -euo pipefail
          TAG="$(echo "$GITHUB_SHA" | cut -c1-7)"
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REPO }}/${DOCKER_ENV}-backend"
          docker build \
            -f "devops/docker/${DOCKER_ENV}/backend.Dockerfile" \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      # 5. Build & push frontend image
      - name: Build & push frontend image
        env:
          DOCKER_ENV: ${{ steps.env.outputs.docker_env }}
          BACKEND_URL: ${{ steps.env.outputs.backend_url }}
        run: |
          set -euo pipefail
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REPO }}/${DOCKER_ENV}-frontend"
          docker build \
            -f "devops/docker/${DOCKER_ENV}/frontend.Dockerfile" \
            --build-arg NEXT_PUBLIC_BACKEND_URL="$BACKEND_URL" \
            -t "$IMAGE:$IMAGE_TAG" -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:latest"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # 6. helm deploy into Cluster
      - name: Helm upgrade
        env:
          DOCKER_ENV: ${{ steps.env.outputs.docker_env }}
          NAMESPACE: ${{ steps.env.outputs.namespace }}
          RELEASE: ${{ steps.env.outputs.helm_release }}
          VALUES_FILE: ${{ steps.env.outputs.values_file }}
        run: |
          set -euo pipefail
          helm upgrade --install "$RELEASE" ./devops/helm \
            -f "./devops/helm/${VALUES_FILE}" \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --set "fe-${DOCKER_ENV}.image.tag=${IMAGE_TAG}" \
            --set "be-${DOCKER_ENV}.image.tag=${IMAGE_TAG}" \
            --atomic \
            --timeout 5m