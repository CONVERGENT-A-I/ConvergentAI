name: Deploy CONVERGENT-AI to GCP VM

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to deploy"
        required: true
        default: production
        type: choice
        options:
          - production
          - dev

concurrency:
  group: deploy-${{ github.ref_name }}-${{ github.event.inputs.target || 'auto' }}
  cancel-in-progress: false

env:
  GH_OWNER: HasanKamal121
  GH_REPO: ConvergentAI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target
        id: env
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target }}"
          else
            TARGET="dev"
          fi
          # git_dir = PARENT folder that holds ConvergentAI/ (and docker/)
          if [ "$TARGET" = "production" ]; then
            echo "branch=main"                                       >> "$GITHUB_OUTPUT"
            echo "vm_name=convergent-ai"                             >> "$GITHUB_OUTPUT"
            echo "git_dir=/opt/convergent-ai/convergent-prod"        >> "$GITHUB_OUTPUT"
            echo "compose_dir=/opt/convergent-ai/convergent-prod/docker"    >> "$GITHUB_OUTPUT"
            echo "env_name=production"                               >> "$GITHUB_OUTPUT"
            echo "secret_prefix=prod-convergent"                     >> "$GITHUB_OUTPUT"
          else
            echo "branch=dev"                                           >> "$GITHUB_OUTPUT"
            echo "vm_name=convergent-dev"                               >> "$GITHUB_OUTPUT"
            echo "git_dir=/opt/convergent-ai/convergent-dev"            >> "$GITHUB_OUTPUT"
            echo "compose_dir=/opt/convergent-ai/convergent-dev/docker" >> "$GITHUB_OUTPUT"
            echo "env_name=dev"                                         >> "$GITHUB_OUTPUT"
            echo "secret_prefix=dev-convergent"                        >> "$GITHUB_OUTPUT"
          fi

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Render the remote script LOCALLY with values already substituted.
      # The clone URL embeds the PAT from a GitHub Secret (never hardcoded on VM).
      - name: Render remote deploy script
        id: script
        env:
          BRANCH: ${{ steps.env.outputs.branch }}
          GIT_DIR: ${{ steps.env.outputs.git_dir }}
          COMPOSE_DIR: ${{ steps.env.outputs.compose_dir }}
          SECRET_PREFIX: ${{ steps.env.outputs.secret_prefix }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          CLONE_URL="https://x-access-token:${GH_PAT}@github.com/${GH_OWNER}/${GH_REPO}.git"

          cat > remote_deploy.sh <<REMOTE
          #!/usr/bin/env bash
          set -euo pipefail
          BRANCH="${BRANCH}"
          GIT_DIR="${GIT_DIR}"
          COMPOSE_DIR="${COMPOSE_DIR}"
          SECRET_PREFIX="${SECRET_PREFIX}"
          GCP_PROJECT="ailana-488814"
          REPO_DIR="\${GIT_DIR}/${GH_REPO}"

          echo "==> Target branch : \${BRANCH}"
          echo "==> Git dir       : \${GIT_DIR}"
          echo "==> Repo dir      : \${REPO_DIR}"
          echo "==> Compose dir   : \${COMPOSE_DIR}"

          mkdir -p "\${GIT_DIR}"

          # ---- 1) Fresh clone every run: remove old checkout, clone branch ----
          echo "==> Removing old checkout: \${REPO_DIR}"
          rm -rf "\${REPO_DIR}"
          echo "==> Cloning \${BRANCH} ..."
          git clone --depth 1 --branch "\${BRANCH}" "${CLONE_URL}" "\${REPO_DIR}"
          # scrub token from git config so it isn't left on disk
          git -C "\${REPO_DIR}" remote set-url origin "https://github.com/${GH_OWNER}/${GH_REPO}.git"
          echo "==> Checked out: \$(git -C "\${REPO_DIR}" rev-parse --short HEAD) on \${BRANCH}"

          # ---- 2) Pull env files from Secret Manager (per environment) ----
          cd "\${COMPOSE_DIR}"
          echo "==> Fetching env from Secret Manager (\${SECRET_PREFIX}-*)"
          gcloud secrets versions access latest \
            --secret="\${SECRET_PREFIX}-frontend-env" --project="\${GCP_PROJECT}" > frontend.env
          gcloud secrets versions access latest \
            --secret="\${SECRET_PREFIX}-backend-env"  --project="\${GCP_PROJECT}" > backend.env
          chmod 600 frontend.env backend.env
          echo "==> env pulled: frontend.env=\$(grep -vcE '^\s*#|^\s*\$' frontend.env) vars, backend.env=\$(grep -vcE '^\s*#|^\s*\$' backend.env) vars"

          # ---- 3) Locate compose file ----
          if   [ -f docker-compose.yaml ]; then COMPOSE="-f docker-compose.yaml"
          elif [ -f docker-compose.yml  ]; then COMPOSE="-f docker-compose.yml"
          elif [ -f docker/docker-compose.yaml ]; then COMPOSE="-f docker/docker-compose.yaml"
          else
            echo "No docker-compose file under \${COMPOSE_DIR}" >&2
            ls -la "\${COMPOSE_DIR}" >&2
            exit 1
          fi
          echo "==> Compose dir: \$(pwd)  file: \${COMPOSE}"

          dc() { docker compose \${COMPOSE} "\$@" || docker-compose \${COMPOSE} "\$@"; }

          echo "==> Docker usage BEFORE"
          docker system df || true
          echo "==> Stop old containers"
          dc down || true
          export DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1
          echo "==> Rebuild images (no cache)"
          dc build --pull --no-cache
          echo "==> Start containers"
          dc up -d --force-recreate --remove-orphans
          echo "==> Verify"
          docker ps | grep convergent || true
          echo "==> Cleanup (keep recent build cache for fast rebuilds)"
          docker builder prune -f --filter "until=24h" || true
          docker image prune -f || true
          docker container prune -f || true
          REMOTE

          echo "----- rendered remote_deploy.sh (token masked) -----"
          sed 's#x-access-token:[^@]*@#x-access-token:***@#g' remote_deploy.sh

      - name: Deploy to GCP VM (${{ steps.env.outputs.env_name }})
        run: |
          set -euo pipefail
          echo "Deploying to VM: ${{ steps.env.outputs.vm_name }}"
          gcloud compute ssh  ${{ steps.env.outputs.vm_name }} \
            --zone us-east1-b \
            --project ailana-488814 \
            --tunnel-through-iap \
            --quiet \
            --command="sudo bash -s" < remote_deploy.sh           
