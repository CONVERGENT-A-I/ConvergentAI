name: Deploy CONVERGENT-AI to EKS Cluster into "us-east-1" region

# - push to "dev"            -> auto build + deploy into EKS dev environment.
# - staging manual deploy    -> Actions -> Run workflow -> branch "staging" -> target "staging".
# - production manual deploy -> Actions -> Run workflow -> branch "main" -> target "production".
on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to deploy"
        required: true
        default: production
        type: choice
        options:
          - dev
          - staging
          - production

concurrency:
  group: eks-deploy-${{ inputs.target || 'dev' }}
  cancel-in-progress: false

env:
  DEVOPS_REPO_OWNER: sonphm
  DEVOPS_REPO_NAME: convergentai-devops
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '939762009580'
  EKS_CLUSTER: convergent-ai-eks-cluster
  ECR_REPOSITORY: convergent-ai-ecr-repo

jobs:
  deploy:
    environment: ${{ inputs.target || 'dev' }}
    runs-on: ${{ vars.EKS_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve target
        id: env
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target }}"
          else
            TARGET="dev"
          fi

          if [ "$GITHUB_REF_TYPE" != branch ] || { [ "$TARGET" = dev ] && [ "$GITHUB_REF_NAME" != dev ]; }; then
            echo "Select the matching deployment branch."
            exit 1
          fi
          # Prevent a manual deployment from using the wrong source branch.
          if [ "$TARGET" = "staging" ] && [ "$GITHUB_REF_NAME" != "staging" ]; then
            echo "Staging must be deployed manually from the staging branch."
            exit 1
          fi

          if [ "$TARGET" = "production" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Production must be deployed manually from the main branch."
            exit 1
          fi

          if [ "$TARGET" = "production" ]; then
            echo "docker_env=prod"                                    >> "$GITHUB_OUTPUT"
            echo "values_file=values_prod.yaml"                       >> "$GITHUB_OUTPUT"
            echo "namespace=cta-prod"                                 >> "$GITHUB_OUTPUT"
            echo "helm_release=cta-prod"                              >> "$GITHUB_OUTPUT"
            echo "secret_prefix=prod-convergent"                      >> "$GITHUB_OUTPUT"
            echo "backend_url=https://be.convergentai.tech"           >> "$GITHUB_OUTPUT"
            echo "env_name=production"                                >> "$GITHUB_OUTPUT"
          elif [ "$TARGET" = "staging" ]; then
            echo "docker_env=staging"                                 >> "$GITHUB_OUTPUT"
            echo "values_file=values_staging.yaml"                    >> "$GITHUB_OUTPUT"
            echo "namespace=cta-staging"                              >> "$GITHUB_OUTPUT"
            echo "helm_release=cta-staging"                           >> "$GITHUB_OUTPUT"
            echo "secret_prefix=staging-convergent"                   >> "$GITHUB_OUTPUT"
            echo "backend_url=https://staging-be.convergentai.tech"   >> "$GITHUB_OUTPUT"
            echo "env_name=staging"                                   >> "$GITHUB_OUTPUT"
          else
            echo "docker_env=dev"                                     >> "$GITHUB_OUTPUT"
            echo "values_file=values_dev.yaml"                        >> "$GITHUB_OUTPUT"
            echo "namespace=cta-dev"                                  >> "$GITHUB_OUTPUT"
            echo "helm_release=cta-dev"                               >> "$GITHUB_OUTPUT"
            echo "secret_prefix=dev-convergent"                       >> "$GITHUB_OUTPUT"
            echo "backend_url=https://dev-be.convergentai.tech"       >> "$GITHUB_OUTPUT"
            echo "env_name=dev"                                       >> "$GITHUB_OUTPUT"
          fi
          echo "==> Deploying target: $TARGET"

      # 1. Checkout Source codes repo
      - name: Checkout app source (ConvergentAI)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 2. Checkout DevOps repo
      - name: Checkout devops repo (Dockerfile + Helm chart)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEVOPS_REPO_OWNER }}/${{ env.DEVOPS_REPO_NAME }}
          ref: main
          token: ${{ secrets.GIT_DEVOPS_TOKEN }}
          path: devops
          persist-credentials: false

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: github-${{ github.run_id }}

      - name: Connect to EKS and log in to ECR
        shell: bash
        env:
          NAMESPACE: ${{ steps.env.outputs.namespace }}
        run: |
          set -euo pipefail
          umask 077
          # tmp=$(mktemp -d "$RUNNER_TEMP/cta-deploy.XXXXXX")
          # export KUBECONFIG="$tmp/kubeconfig" DOCKER_CONFIG="$tmp/docker"
          # printf 'JOB_DIR=%s\nKUBECONFIG=%s\nDOCKER_CONFIG=%s\n' "$tmp" "$KUBECONFIG" "$DOCKER_CONFIG" >> "$GITHUB_ENV"
          # mkdir "$DOCKER_CONFIG"
          # aws eks update-kubeconfig --name "$EKS_CLUSTER" --kubeconfig "$KUBECONFIG"
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"
          kubectl -n "$NAMESPACE" get deployments --request-timeout=20s
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          echo "IMAGE_REPO=$registry/$ECR_REPOSITORY" >> "$GITHUB_ENV"

      - name: Build and push backend and frontend
        shell: bash
        env:
          STAGE: ${{ steps.env.outputs.docker_env }}
          BACKEND_URL: ${{ steps.env.outputs.backend_url }}
        run: |
          set -euo pipefail
          suffix="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for component in backend frontend; do
            tag="$STAGE-$component-$suffix"
            args=()
            if [[ "$component" == frontend ]]; then
              args+=(--build-arg "NEXT_PUBLIC_BACKEND_URL=$BACKEND_URL")
            fi
            docker build --platform linux/amd64 "${args[@]}" -f "devops/aws-deploy/docker/$STAGE/$component.Dockerfile" -t "$IMAGE_REPO:$tag" .
            docker push "$IMAGE_REPO:$tag"
            echo "${component^^}_TAG=$tag" >> "$GITHUB_ENV"
          done

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      # 6. Create/update ConfigMaps from GitHub repository variables
      - name: Apply application environment variables
        shell: bash
        env:
          DOCKER_ENV: ${{ steps.env.outputs.docker_env }}
          NAMESPACE: ${{ steps.env.outputs.namespace }}
          DEV_FE: ${{ vars.DEV_FE }}
          DEV_BE: ${{ vars.DEV_BE }}
          STAGING_FE: ${{ vars.STAGING_FE }}
          STAGING_BE: ${{ vars.STAGING_BE }}
          PROD_FE: ${{ vars.PROD_FE }}
          PROD_BE: ${{ vars.PROD_BE }}
        run: |
          set -euo pipefail
          umask 077

          if [ "$DOCKER_ENV" = "prod" ]; then
            FE_ENV="$PROD_FE"
            BE_ENV="$PROD_BE"
          elif [ "$DOCKER_ENV" = "staging" ]; then
            FE_ENV="$STAGING_FE"
            BE_ENV="$STAGING_BE"
          else
            FE_ENV="$DEV_FE"
            BE_ENV="$DEV_BE"
          fi

          if [ -z "$FE_ENV" ] || [ -z "$BE_ENV" ]; then
            echo "Missing GitHub Variables for environment: $DOCKER_ENV"
            exit 1
          fi

          FE_ENV_FILE="${RUNNER_TEMP}/${DOCKER_ENV}-frontend.env"
          BE_ENV_FILE="${RUNNER_TEMP}/${DOCKER_ENV}-backend.env"
          CONFIG_FILE="${RUNNER_TEMP}/${DOCKER_ENV}-configmaps.yaml"
          trap 'rm -f "$FE_ENV_FILE" "$BE_ENV_FILE" "$CONFIG_FILE"' EXIT

          printf '%s\n' "$FE_ENV" > "$FE_ENV_FILE"
          printf '%s\n' "$BE_ENV" > "$BE_ENV_FILE"

          kubectl create configmap "cta-${DOCKER_ENV}-frontend-env" \
            --namespace "$NAMESPACE" \
            --from-env-file="$FE_ENV_FILE" \
            --dry-run=client \
            -o yaml > "$CONFIG_FILE"

          echo "---" >> "$CONFIG_FILE"

          kubectl create configmap "cta-${DOCKER_ENV}-backend-env" \
            --namespace "$NAMESPACE" \
            --from-env-file="$BE_ENV_FILE" \
            --dry-run=client \
            -o yaml >> "$CONFIG_FILE"

          kubectl apply -f "$CONFIG_FILE" -n "$NAMESPACE"
          
      # 7. helm deploy into Cluster
      - name: Helm upgrade
        env:
          DOCKER_ENV: ${{ steps.env.outputs.docker_env }}
          NAMESPACE: ${{ steps.env.outputs.namespace }}
          RELEASE: ${{ steps.env.outputs.helm_release }}
          ACM_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
          VALUES_FILE: ${{ steps.env.outputs.values_file }}
        run: |
          set -euo pipefail
          extra=()
          if [[ -n "$ACM_ARN" ]]; then extra+=(--set-string "global.alb.certificateArn=$ACM_ARN"); fi
          if [[ "$DOCKER_ENV" == dev ]]; then
            extra+=(--set-string "fe-dev.ingress.groupName=" --set-string "be-dev.ingress.groupName=")
          fi
          helm upgrade --install "$RELEASE" ./devops/aws-deploy/helm \
            -f "./devops/aws-deploy/helm/${VALUES_FILE}" --namespace "$NAMESPACE" \
            --set-string "fe-${DOCKER_ENV}.image.repository=$IMAGE_REPO" \
            --set-string "fe-${DOCKER_ENV}.image.tag=$FRONTEND_TAG" \
            --set-string "be-${DOCKER_ENV}.image.repository=$IMAGE_REPO" \
            --set-string "be-${DOCKER_ENV}.image.tag=$BACKEND_TAG" \
            "${extra[@]}" --atomic --timeout 10m

      - name: Clean up job credentials
        if: always()
        shell: bash
        run: |
          if [[ -n "${JOB_DIR:-}" && "$JOB_DIR" == "$RUNNER_TEMP"/cta-deploy.* ]]; then rm -rf -- "$JOB_DIR"; fi
