name: Deploy CONVERGENT-AI to GCP VM

on:
  # dev: auto-deploy on every push
  push:
    branches:
      - dev
  # main (production): manual only
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to deploy"
        required: true
        default: production
        type: choice
        options:
          - production
          - dev

# Prevent overlapping deploys to the same environment
concurrency:
  group: deploy-${{ github.ref_name }}-${{ github.event.inputs.target || 'auto' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ---- Resolve environment -> branch + app dir (single source of truth) ----
      # Rules:
      #  - push to dev            -> dev (auto)
      #  - manual dispatch input  -> production or dev (as chosen)
      - name: Resolve target
        id: env
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target }}"
          else
            TARGET="dev"   # push trigger only fires on dev branch
          fi

          # git_dir  = where the repo lives (git pull happens here)
          # compose_dir = where `docker compose` runs (holds compose file/.env)
          if [ "$TARGET" = "production" ]; then
            echo "branch=main"                                                      
            echo "git_dir=/opt/convergent-ai/convergent-prod"  
            echo "compose_dir=/opt/convergent-ai/convergent-prod"                               
            echo "env_name=production"                                              
          else
            echo "branch=dev"                                                     
            echo "git_dir=/opt/convergent-ai/convergent-dev"   
            echo "compose_dir=/opt/convergent-ai/convergent-dev/docker"                          
            echo "env_name=dev"                                                   
          fi

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Docker app to GCP VM (${{ steps.env.outputs.env_name }})
        env:
          BRANCH: ${{ steps.env.outputs.branch }}
          GIT_DIR: ${{ steps.env.outputs.git_dir }}
          COMPOSE_DIR: ${{ steps.env.outputs.compose_dir }}
        run: |
          gcloud compute ssh convergent-ai \
            --zone us-east1-b \
            --project ailana-488814 \
            --tunnel-through-iap \
            --quiet \
            --command="sudo BRANCH='${BRANCH}' GIT_DIR='${GIT_DIR}' COMPOSE_DIR='${COMPOSE_DIR}' bash -s" <<'EOF'
          set -euo pipefail
          echo "==> Target branch : ${BRANCH}"
          echo "==> Git directory : ${GIT_DIR}"
          echo "==> Compose dir   : ${COMPOSE_DIR}"
  
          sudo cd ${GIT_DIR}
          sudo ls -la

          # 1) Clone source code
          echo "==> Clone latest code (${BRANCH})"
          sudo rm -f ConvergentAI
          git clone ${{ secrets.GIT_REPO }} -b ${BRANCH}

          # 2) Re-Deploy
          sudo cd ${COMPOSE_DIR}
          sudo ls -la 
          echo "Docker usage BEFORE deploy"
          sudo docker system df || true
          sudo docker builder du || true
          echo "Stop old containers"
          sudo docker compose down || docker-compose down

          echo "Rebuild and recreate containers"
          sudo docker compose up -d --build || docker-compose up -d --build

          echo "Verify containers"
          sudo docker ps | grep convergent

          echo "Cleanup Docker build cache"
          sudo docker builder prune -a -f

          echo "Cleanup dangling images"
          sudo docker image prune -f

          echo "Cleanup stopped containers"
          sudo docker container prune -f
          EOF
