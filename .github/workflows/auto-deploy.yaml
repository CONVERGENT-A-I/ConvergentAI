name: Deploy CONVERGENT-AI to GCP VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Docker app to GCP VM
        run: |
          gcloud compute ssh convergent-ai \
            --zone us-east1-b \
            --project ailana-488814 \
            --tunnel-through-iap \
            --quiet \
            --command='sudo bash -s' <<'EOF'
          set -euo pipefail

          APP_DIR="/opt/convergent-ai/ConvergentAI"

          echo "Go to app directory"
          cd "$APP_DIR"

          git config --global --add safe.directory "$APP_DIR"

          echo "Pull latest code"
          git fetch origin main
          git reset --hard origin/main

          echo "Docker usage BEFORE deploy"
          docker system df || true
          docker builder du || true

          echo "Stop old containers"
          docker compose down || docker-compose down

          echo "Rebuild and recreate containers"
          docker compose up -d --build || docker-compose up -d --build

          echo "Verify containers"
          docker ps | grep convergent

          echo "Cleanup Docker build cache"
          docker builder prune -a -f

          echo "Cleanup dangling images"
          docker image prune -f

          echo "Cleanup stopped containers"
          docker container prune -f
          EOF
